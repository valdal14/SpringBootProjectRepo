spring.application.name=capstone

# Hibernate DDL-AUTO Flag
spring.jpa.hibernate.ddl-auto=validate

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/shopdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL & Transaction Debug
logging.level.sql=debug
logging.level.org.springframework.test.context.transaction.TransactionContext=debug

# Flyway Flag
spring.flyway.enabled=true